<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ébauche : caché des moteurs de recherche. À retirer au lancement (et public/robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Portfolio de Valentin Frenial, chef de projet digital learning : serious games, parcours blended, micro-learning."
    />
    <title>Valentin Frenial · Chef de projet digital learning</title>
    <meta name="theme-color" content="#0b1220" />
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash.
      // Téléphone : le thème suit celui du téléphone (pas de bouton).
      // Ordinateur : bleu nuit par défaut, sauf si le visiteur a choisi le clair.
      try {
        const root = document.documentElement
        const mobile = matchMedia('(max-width: 639px)').matches
        const system = matchMedia('(prefers-color-scheme: dark)')
        const apply = (dark) => {
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        }
        if (mobile) {
          apply(system.matches)
          system.addEventListener('change', (event) => apply(event.matches))
        } else {
          const saved = localStorage.getItem('theme')
          apply(saved ? saved === 'dark' : true)
        }
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>

    <!-- Aperçu lors d'un partage (LinkedIn, WhatsApp, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Valentin Frenial" />
    <meta
      property="og:title"
      content="Valentin Frenial · Chef de projet digital learning"
    />
    <meta
      property="og:description"
      content="E-learnings interactifs, vidéo, motion design et direction artistique, pour Nexans et Chanel."
    />
    <meta
      property="og:url"
      content="https://davision0102.github.io/valentin-frenial-portfolio/"
    />
    <meta
      property="og:image"
      content="https://davision0102.github.io/valentin-frenial-portfolio/images/climate-training-1.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
