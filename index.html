<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ébauche : caché des moteurs de recherche. À retirer au lancement (et public/robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Portfolio de Valentin Frenial, chef de projet digital e-learning : serious games, parcours blended, micro-learning."
    />
    <title>Valentin Frenial · Chef de projet digital e-learning</title>
    <meta
      name="theme-color"
      content="#121a33"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121a33"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Aperçu lors d'un partage (LinkedIn, WhatsApp, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Valentin Frenial" />
    <meta
      property="og:title"
      content="Valentin Frenial · Chef de projet digital e-learning"
    />
    <meta
      property="og:description"
      content="E-learnings interactifs, vidéo, motion design et direction artistique, pour Nexans et Chanel."
    />
    <meta
      property="og:url"
      content="https://davision0102.github.io/valentin-frenial-portfolio/"
    />
    <meta
      property="og:image"
      content="https://davision0102.github.io/valentin-frenial-portfolio/images/climate-training-1.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash.
      try {
        const saved = localStorage.getItem('theme')
        // Bleu nuit par défaut, sauf si le visiteur a choisi le thème clair.
        const dark = saved ? saved === 'dark' : true
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
